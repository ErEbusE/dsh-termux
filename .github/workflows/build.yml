name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh npm spec to install (e.g. @deepseek-ai/dsh@next)'
        required: false
        default: '@deepseek-ai/dsh@latest'

env:
  NODE_VERSION: "24"

jobs:
  # Verify the two Android hard-link patches apply cleanly to the published
  # npm lib files, and that a fresh install + patch + boot smoke passes on a
  # standard Linux host (proving the patches don't regress non-Android).
  #
  # The scratch dir lives inside the checkout on purpose: that is what the
  # release build does too, and `git apply --directory=...` silently skips
  # patches whose paths sit outside the current dir when the target is inside a
  # git work tree. scripts/patch-lib.sh handles that; running the shared helper
  # here keeps CI on the same code path as the device scripts.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # setup-node >=5 caches the package manager automatically. There is no
          # lockfile at the repo root (the scratch install lives in work/), and a
          # fresh resolve against the registry is the point of this job, so the
          # cache is off on purpose.
          package-manager-cache: false

      - name: Create scratch dir
        run: mkdir -p work

      - name: Install dsh (--ignore-scripts)
        env:
          DSH_SPEC: ${{ github.event.inputs.dsh_version || '@deepseek-ai/dsh@latest' }}
        run: |
          set -euo pipefail
          cd work
          npm init -y >/dev/null
          npm install "$DSH_SPEC" --ignore-scripts
          node -e 'const p=require("./node_modules/@deepseek-ai/dsh/package.json");console.log("installed dsh",p.version)'

      - name: Apply patches to node_modules lib files
        run: |
          set -euo pipefail
          source scripts/patch-lib.sh
          dsh_apply_patch_set "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/patches"

      - name: Verify patched markers present
        run: |
          set -euo pipefail
          source scripts/patch-lib.sh
          dsh_verify_patch_markers "$GITHUB_WORKSPACE/work" \
            dsh-session-persistence-jsonl/lib/index.js \
            dsh-fs-local/lib/index.js
          echo "OK: both patches applied"

      # Guard the failure mode that let this workflow report success while the
      # libs stayed unpatched: an apply that does not actually change the
      # target must exit non-zero instead of printing OK.
      - name: Regression guard (silent git-apply skip must fail)
        run: |
          set -euo pipefail
          source scripts/patch-lib.sh
          probe="$RUNNER_TEMP/probe"
          rm -rf "$probe"
          mkdir -p "$probe/node_modules/@deepseek-ai/dsh-fs-local/lib"
          # An empty file cannot accept the patch, so a helper that really
          # applies (and checks) must exit non-zero here.
          : > "$probe/node_modules/@deepseek-ai/dsh-fs-local/lib/index.js"
          if dsh_apply_patch "$probe" \
            "$GITHUB_WORKSPACE/patches/npm-dsh-fs-local-link-rename.patch" \
            dsh-fs-local/lib/index.js; then
            echo "FAIL: patch helper reported success on a file it cannot patch"
            exit 1
          fi
          echo "OK: helper fails loudly instead of skipping silently"

      - name: Boot smoke (CLI version + web listen)
        run: |
          set -euo pipefail
          cd work
          DSH_BIN=node_modules/@deepseek-ai/dsh/lib/bin.js
          node --expose-internals "$DSH_BIN" --version

          # `dsh web --port 0` picks a free port and prints the URL it serves.
          node --expose-internals "$DSH_BIN" web --port 0 --no-open \
            </dev/null >web.log 2>&1 &
          PID=$!
          URL=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            URL="$(grep -o 'http://127\.0\.0\.1:[0-9]*' web.log | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "FAIL: dsh web never reported a listen URL"
            cat web.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          echo "dsh web listening on $URL"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 1 \
            --retry-all-errors --max-time 20 "$URL/" || true)"
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "GET $URL/ -> $CODE"
          cat web.log
          [ "$CODE" = "200" ] || { echo "FAIL: web UI did not answer with 200"; exit 1; }
          echo "boot smoke done"

      # Two Termux-specific launch facts the generated wrapper owns:
      #   - Node must be exec'd DIRECTLY. Through grun (`ld.so <node>`)
      #     process.execPath becomes the loader, and every dsh helper that
      #     re-spawns it breaks — the `dsh web` browser handoff most visibly.
      #   - $BROWSER must point at the Android-intent opener.
      # Nothing here needs Termux: the generator is plain bash.
      - name: Verify dsh wrapper generator (direct exec + $BROWSER)
        run: |
          set -euo pipefail
          source scripts/common.sh
          mkdir -p wrapper-check
          write_dsh_wrapper wrapper-check/dsh /fake/node /fake/bin.js
          bash -n wrapper-check/dsh
          sh -n wrapper-check/dsh-termux-open
          test -x wrapper-check/dsh
          test -x wrapper-check/dsh-termux-open
          opener="$PWD/wrapper-check/dsh-termux-open"
          grep -qF 'exec "/fake/node" --expose-internals "/fake/bin.js" "$@"' wrapper-check/dsh
          if grep -q 'exec grun' wrapper-check/dsh; then
            echo "FAIL: wrapper still routes Node through grun (breaks process.execPath)"; exit 1
          fi
          grep -qF 'unset LD_PRELOAD' wrapper-check/dsh
          grep -qF "export BROWSER=\"$opener\"" wrapper-check/dsh
          # $BROWSER must resolve to the opener, and an inherited value must win.
          sed '$d' wrapper-check/dsh > wrapper-check/head.sh
          probe() { bash -c '. wrapper-check/head.sh; printf %s "${BROWSER-}"'; }
          picked="$(BROWSER= probe)"
          test "$picked" = "$opener" || { echo "FAIL: BROWSER not pointed at opener (got '$picked')"; exit 1; }
          kept="$(BROWSER=/usr/bin/firefox probe)"
          test "$kept" = /usr/bin/firefox \
            || { echo "FAIL: inherited BROWSER was overridden (got '$kept')"; exit 1; }
          echo 'OK: wrapper execs Node directly and wires $BROWSER'

      # The opener must route URLs and file paths to DIFFERENT Android intents:
      # `am start -d <bare path>` cannot resolve an Intent, so a .html/.svg path
      # handed to termux-open-url fails where termux-open succeeds.
      - name: Verify $BROWSER opener dispatch (URL vs file path)
        run: |
          set -euo pipefail
          mkdir -p wrapper-check/stub
          for t in termux-open-url termux-open; do
            printf '#!/bin/sh\necho "%s"\n' "$t" > "wrapper-check/stub/$t"
            chmod +x "wrapper-check/stub/$t"
          done
          export PATH="$PWD/wrapper-check/stub:$PATH"
          expect() {
            # Run via `sh`, not directly: the opener's shebang points at
            # Termux's /data/data/com.termux/files/usr/bin/sh, which does not
            # exist on this ubuntu runner — direct exec would die with
            # "cannot execute: required file not found" before the dispatch
            # logic ever runs.
            got="$(sh wrapper-check/dsh-termux-open "$2")"
            test "$got" = "$1" || { echo "FAIL: '$2' routed to $got, expected $1"; exit 1; }
          }
          expect termux-open-url http://127.0.0.1:3080
          expect termux-open-url https://example.com/a?b=c
          expect termux-open /home/u/report.html
          expect termux-open /home/u/chart.svg
          expect termux-open /home/u/notes.md
          if sh wrapper-check/dsh-termux-open >/dev/null 2>&1; then
            echo "FAIL: no-arg invocation should fail"; exit 1
          fi
          rm -rf wrapper-check
          echo "OK: opener routes URLs to termux-open-url and paths to termux-open"

      # install.sh sources the shared helpers straight out of the release
      # tarball (scripts/common.sh — the same file update-dsh.sh runs on-device),
      # so there is no second copy of the configure/wrapper/opener logic to
      # drift. Guard against re-introducing one: install.sh must delegate to the
      # common.sh functions and own NO inline copies; and the --set-rpath
      # segfault trap must only ever live where the interpreter is patched.
      - name: Verify install.sh delegates to common.sh (no duplicated logic)
        run: |
          set -euo pipefail
          grep -qF 'source "$PREFIX/scripts/common.sh"' build/install.sh \
            || { echo "FAIL: install.sh does not source scripts/common.sh"; exit 1; }
          grep -qF 'configure_glibc_node "$NODE_BIN"' build/install.sh \
            || { echo "FAIL: install.sh does not call configure_glibc_node"; exit 1; }
          grep -qF 'write_dsh_wrapper "$WRAPPER" "$NODE_BIN" "$DSH_BIN"' build/install.sh \
            || { echo "FAIL: install.sh does not call write_dsh_wrapper"; exit 1; }
          # Function definitions, heredocs and the interpreter patch live in
          # scripts/common.sh only — none of these may appear in install.sh.
          for sig in 'configure_glibc_node()' 'write_dsh_wrapper()' 'write_dsh_opener()' \
                     'DSH_OPENER' 'DSH_WRAPPER_HEAD' '--set-interpreter'; do
            if grep -qF "$sig" build/install.sh; then
              echo "FAIL: install.sh contains duplicated '$sig' (should live only in scripts/common.sh)"; exit 1
            fi
          done
          # configure_glibc_node patches ONLY the interpreter: adding --set-rpath
          # in the same patchelf run yields a segfaulting Node binary. Comments
          # may name the flag (they explain the trap), so only check code lines.
          grep -qF -- '--set-interpreter' scripts/common.sh \
            || { echo "FAIL: scripts/common.sh does not set the ELF interpreter"; exit 1; }
          if grep -v '^[[:space:]]*#' scripts/common.sh | grep -qF -- '--set-rpath'; then
            echo "FAIL: scripts/common.sh uses --set-rpath; combined with --set-interpreter that segfaults Node"; exit 1
          fi
          echo "OK: install.sh delegates to common.sh; --set-rpath trap guarded"

