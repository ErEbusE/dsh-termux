name: verify

# Fast, always-on static verification: everything that can be checked WITHOUT
# installing anything from the network. Runs on every pull request and every
# push to main and is expected to finish in well under a minute.
#
# Its expensive counterpart — install dsh from npm, apply the patch set, boot
# it — lives in patch-check.yml and only runs when the patch inputs actually
# change (plus nightly, as an upstream-drift canary). The split follows the one
# real cost boundary in this repository: whether a check needs an npm install.
# Patch drift is a function of TIME (upstream publishes), not of what a pull
# request changes, so a docs or test-harness PR must not pay ~16 minutes of npm
# install to learn nothing about itself.
#
# If branch protection is ever enabled on main, make "verify / static" the
# required check. Do NOT require patch-check: a path-filtered workflow that
# does not run leaves a required check pending forever.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale runs on a PR branch; never cancel a main run, whose history
  # is the record of what main looked like.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Every tracked shell script — including scripts/update-dsh.sh, the
      # scripts/0x-* pipeline, build/build-runtime.sh and the .test-install
      # harness, none of which had any CI coverage before the split.
      - name: Shell syntax (bash -n)
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "FAIL: $f"; rc=1; }
          done < <(git ls-files '*.sh')
          [ "$rc" = 0 ] || { echo "FAIL: shell syntax"; exit 1; }
          echo "OK: bash -n clean ($(git ls-files '*.sh' | wc -l) scripts)"

      # -s bash: 19 of the 20 tracked scripts carry Termux's absolute shebang
      # (#!/data/data/com.termux/files/usr/bin/bash), and naming the dialect
      # explicitly keeps this independent of shebang recognition. They really
      # are all bash — the only POSIX sh artifact (the $BROWSER opener) is
      # generated by write_dsh_opener, not tracked. -x follows sourced helpers.
      #
      # -P SCRIPTDIR: the '# shellcheck source=' directives are written relative
      # to each script's own directory, which is what a reader expects. Without
      # this flag shellcheck resolves them against the working directory, fails
      # to follow the library, and then invents SC2034s for variables the
      # library is the one reading.
      #
      # Severity: the tree is clean at 'warning'. Per-line
      # '# shellcheck disable=SCxxxx' with a stated reason is the escape hatch;
      # blanket suppression is not.
      #
      # Version skew is real: the runner image pins shellcheck 0.9.0 while
      # Termux ships 0.11.0, and they do not report the same set (0.9.0 raised
      # an SC2120 that 0.11.0 stays quiet about). THE RUNNER'S VERSION IS THE
      # GATE — hence the version line printed below, so a surprise finding is
      # attributable at a glance rather than mistaken for a flaky check.
      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck --version | sed -n '/^version:/p'
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck -s bash -x -P SCRIPTDIR -S warning "${files[@]}"
          echo "OK: shellcheck clean at severity=warning (${#files[@]} scripts)"

      # DSH_PATCH_SET is the single registry every consumer derives from, so a
      # mistake here silently weakens the whole patch pipeline. This is also the
      # backstop for patch-check.yml's path filter: if the patch inputs change
      # in a way the filter misses, the registry-level error still surfaces on
      # every pull request, in seconds, with no npm install.
      - name: Patch set integrity (static)
        run: |
          set -euo pipefail
          source scripts/patch-lib.sh
          rc=0
          declare -A seen=()
          for entry in "${DSH_PATCH_SET[@]}"; do
            IFS=: read -r file rel marker precondition extra <<<"$entry"
            if [ -z "$file" ] || [ -z "$rel" ] || [ -z "$marker" ] || [ -n "$extra" ]; then
              echo "FAIL: malformed DSH_PATCH_SET entry (want <patch>:<rel>:<marker>[:<precondition>]): $entry"
              rc=1; continue
            fi
            seen["$file"]=1
            p="patches/$file"
            if [ ! -f "$p" ]; then
              echo "FAIL: $file is registered but missing from patches/"; rc=1; continue
            fi
            # The patch must target exactly the lib the registry pairs it with.
            if ! grep -qxF "+++ b/$rel" "$p"; then
              echo "FAIL: $file does not patch '+++ b/$rel' (the registry says it should)"; rc=1
            fi
            # ...and it must really introduce the marker the verifier greps for.
            # Read the added lines into a variable first: piping into 'grep -q'
            # makes grep exit on the first match and kills the producer with
            # SIGPIPE, which -o pipefail then reports as a phantom failure.
            added="$(grep -E '^\+' "$p" || true)"
            case "$added" in
              *"$marker"*) ;;
              *) echo "FAIL: $file never adds its registry marker '$marker'"; rc=1 ;;
            esac
            # A conditional entry gates itself on a string that must OUTLIVE the
            # patch: if the patch deleted its own precondition, applicability
            # would flip after the first run and the fix would silently be
            # reverted-and-skipped on the next one.
            if [ -n "$precondition" ]; then
              removed="$(grep -E '^-' "$p" || true)"
              case "$removed" in
                *"$precondition"*)
                  echo "FAIL: $file removes its own precondition '$precondition' (applicability would flip)"
                  rc=1 ;;
              esac
            fi
            echo "  OK $file -> $rel (marker: $marker${precondition:+, only when '$precondition' is present})"
          done
          # ...and no orphans: a patch file nobody applies is worse than none.
          for p in patches/*.patch; do
            [ -e "$p" ] || continue
            f="${p#patches/}"
            [ -n "${seen[$f]:-}" ] || { echo "FAIL: $p is not registered in DSH_PATCH_SET"; rc=1; }
          done
          [ "$rc" = 0 ] || { echo "FAIL: patch set integrity"; exit 1; }
          echo "OK: DSH_PATCH_SET and patches/ agree (${#DSH_PATCH_SET[@]} patches)"

      # Two Termux-specific launch facts the generated wrapper owns:
      #   - Node must be exec'd DIRECTLY. Through grun (`ld.so <node>`)
      #     process.execPath becomes the loader, and every dsh helper that
      #     re-spawns it breaks — the `dsh web` browser handoff most visibly.
      #   - $BROWSER must point at the Android-intent opener.
      # Nothing here needs Termux: the generator is plain bash.
      - name: Verify dsh wrapper generator (direct exec + $BROWSER)
        run: |
          set -euo pipefail
          source scripts/common.sh
          mkdir -p wrapper-check
          write_dsh_wrapper wrapper-check/dsh /fake/node /fake/bin.js
          bash -n wrapper-check/dsh
          sh -n wrapper-check/dsh-termux-open
          test -x wrapper-check/dsh
          test -x wrapper-check/dsh-termux-open
          opener="$PWD/wrapper-check/dsh-termux-open"
          grep -qF 'exec "/fake/node" --expose-internals "/fake/bin.js" "$@"' wrapper-check/dsh
          if grep -q 'exec grun' wrapper-check/dsh; then
            echo "FAIL: wrapper still routes Node through grun (breaks process.execPath)"; exit 1
          fi
          grep -qF 'unset LD_PRELOAD' wrapper-check/dsh
          grep -qF "export BROWSER=\"$opener\"" wrapper-check/dsh
          # $BROWSER must resolve to the opener, and an inherited value must win.
          sed '$d' wrapper-check/dsh > wrapper-check/head.sh
          probe() { bash -c '. wrapper-check/head.sh; printf %s "${BROWSER-}"'; }
          picked="$(BROWSER= probe)"
          test "$picked" = "$opener" || { echo "FAIL: BROWSER not pointed at opener (got '$picked')"; exit 1; }
          kept="$(BROWSER=/usr/bin/firefox probe)"
          test "$kept" = /usr/bin/firefox \
            || { echo "FAIL: inherited BROWSER was overridden (got '$kept')"; exit 1; }
          echo 'OK: wrapper execs Node directly and wires $BROWSER'

          # The optional fourth argument bakes the Termux update shortcut into
          # the wrapper: an invocation whose FIRST argument is "update" hands
          # over to the runtime's update-dsh.sh with the rest of argv.
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$*"' > wrapper-check/fake-updater.sh
          chmod +x wrapper-check/fake-updater.sh
          UPDATER="$PWD/wrapper-check/fake-updater.sh"
          write_dsh_wrapper wrapper-check/dsh-up /fake/node /fake/bin.js "$UPDATER"
          bash -n wrapper-check/dsh-up
          grep -qF '= "update"' wrapper-check/dsh-up \
            || { echo "FAIL: four-arg wrapper lacks the update shortcut"; exit 1; }
          grep -qF "\"$UPDATER\"" wrapper-check/dsh-up \
            || { echo "FAIL: updater path not baked verbatim"; exit 1; }
          got="$(bash wrapper-check/dsh-up update -t next -y)"
          [ "$got" = "-t next -y" ] || { echo "FAIL: update forwarded '$got'"; exit 1; }
          grep -qF 'exec "/fake/node" --expose-internals "/fake/bin.js" "$@"' wrapper-check/dsh-up \
            || { echo "FAIL: non-update invocations no longer reach dsh"; exit 1; }
          if grep -q '"update"' wrapper-check/dsh; then
            echo "FAIL: three-arg wrapper unexpectedly grew an update hook"; exit 1
          fi
          echo 'OK: update shortcut emitted only with the 4th arg and forwards argv'

      # The opener must route URLs and file paths to DIFFERENT Android intents:
      # `am start -d <bare path>` cannot resolve an Intent, so a .html/.svg path
      # handed to termux-open-url fails where termux-open succeeds.
      - name: Verify $BROWSER opener dispatch (URL vs file path)
        run: |
          set -euo pipefail
          mkdir -p wrapper-check/stub
          for t in termux-open-url termux-open; do
            printf '#!/bin/sh\necho "%s"\n' "$t" > "wrapper-check/stub/$t"
            chmod +x "wrapper-check/stub/$t"
          done
          export PATH="$PWD/wrapper-check/stub:$PATH"
          expect() {
            # Run via `sh`, not directly: the opener's shebang points at
            # Termux's /data/data/com.termux/files/usr/bin/sh, which does not
            # exist on this ubuntu runner — direct exec would die with
            # "cannot execute: required file not found" before the dispatch
            # logic ever runs.
            got="$(sh wrapper-check/dsh-termux-open "$2")"
            test "$got" = "$1" || { echo "FAIL: '$2' routed to $got, expected $1"; exit 1; }
          }
          expect termux-open-url http://127.0.0.1:3080
          expect termux-open-url https://example.com/a?b=c
          expect termux-open /home/u/report.html
          expect termux-open /home/u/chart.svg
          expect termux-open /home/u/notes.md
          if sh wrapper-check/dsh-termux-open >/dev/null 2>&1; then
            echo "FAIL: no-arg invocation should fail"; exit 1
          fi
          rm -rf wrapper-check
          echo "OK: opener routes URLs to termux-open-url and paths to termux-open"

      # install.sh sources the shared helpers straight out of the release
      # tarball (scripts/common.sh — the same file update-dsh.sh runs on-device),
      # so there is no second copy of the configure/wrapper/opener logic to
      # drift. Guard against re-introducing one: install.sh must delegate to the
      # common.sh functions and own NO inline copies; and the --set-rpath
      # segfault trap must only ever live where the interpreter is patched.
      - name: Verify install.sh delegates to common.sh (no duplicated logic)
        run: |
          set -euo pipefail
          grep -qF 'source "$PREFIX/scripts/common.sh"' build/install.sh \
            || { echo "FAIL: install.sh does not source scripts/common.sh"; exit 1; }
          grep -qF 'configure_glibc_node "$NODE_BIN"' build/install.sh \
            || { echo "FAIL: install.sh does not call configure_glibc_node"; exit 1; }
          grep -qF 'write_dsh_wrapper "$WRAPPER" "$NODE_BIN" "$DSH_BIN"' build/install.sh \
            || { echo "FAIL: install.sh does not call write_dsh_wrapper"; exit 1; }
          # Function definitions, heredocs and the interpreter patch live in
          # scripts/common.sh only — none of these may appear in install.sh.
          for sig in 'configure_glibc_node()' 'write_dsh_wrapper()' 'write_dsh_opener()' \
                     'DSH_OPENER' 'DSH_WRAPPER_HEAD' '--set-interpreter'; do
            if grep -qF "$sig" build/install.sh; then
              echo "FAIL: install.sh contains duplicated '$sig' (should live only in scripts/common.sh)"; exit 1
            fi
          done
          # configure_glibc_node patches ONLY the interpreter: adding --set-rpath
          # in the same patchelf run yields a segfaulting Node binary. Comments
          # may name the flag (they explain the trap), so only check code lines.
          grep -qF -- '--set-interpreter' scripts/common.sh \
            || { echo "FAIL: scripts/common.sh does not set the ELF interpreter"; exit 1; }
          if grep -v '^[[:space:]]*#' scripts/common.sh | grep -qF -- '--set-rpath'; then
            echo "FAIL: scripts/common.sh uses --set-rpath; combined with --set-interpreter that segfaults Node"; exit 1
          fi
          echo "OK: install.sh delegates to common.sh; --set-rpath trap guarded"

      # update-dsh.sh derives its help from the '# help-begin' / '# help-end'
      # sentinels in its own header. This step owns the other half of that
      # contract: the markers exist, the block is real help, and what -h
      # actually prints IS that block. (It also proves the updater still loads
      # on a stock host: it sources common.sh + patch-lib.sh before parsing
      # argv.) No line numbers are restated here — that duplication is exactly
      # what the sentinels removed.
      - name: Updater contract (help sentinels + flags)
        run: |
          set -euo pipefail
          f=scripts/update-dsh.sh
          for marker in '# help-begin' '# help-end'; do
            n="$(grep -c "^${marker}$" "$f" || true)"
            [ "$n" = 1 ] \
              || { echo "FAIL: expected exactly one '${marker}' line in $f, found $n"; exit 1; }
          done
          win="$(sed -n '/^# help-begin/,/^# help-end/{//!p;}' "$f")"
          [ -n "$win" ] || { echo "FAIL: the block between the help sentinels is empty"; exit 1; }
          if grep -qv '^#' <<< "$win"; then
            echo "FAIL: the help block contains non-comment lines:"
            grep -nv '^#' <<< "$win"
            exit 1
          fi
          for flag in -y --yes -v --version -t --tag --self -h; do
            grep -qF -- "$flag" <<< "$win" \
              || { echo "FAIL: the help text does not document $flag, but the parser accepts it"; exit 1; }
          done
          rc=0; out="$(bash "$f" -h 2>&1)" || rc=$?
          [ "$rc" = 0 ] || { echo "FAIL: update-dsh.sh -h exited $rc"; printf '%s\n' "$out"; exit 1; }
          # The contract that matters: what the user sees IS the delimited block.
          diff <(printf '%s\n' "$out") <(printf '%s\n' "$win") \
            || { echo "FAIL: -h output and the help-begin/help-end block have drifted apart"; exit 1; }
          echo "OK: help is derived from the sentinels and documents every flag"

      # The sandbox routes themselves cannot run here (they need Termux, glibc
      # and a real device — see AGENTS.md §0), but the harness ENTRY POINT can:
      # a route file that never got registered is a silent hole in the delivery
      # gate, and the route files are the source of truth for what exists.
      - name: Test harness entry point (run.sh help + route registration)
        run: |
          set -euo pipefail
          rc=0; out="$(bash .test-install/run.sh help 2>&1)" || rc=$?
          [ "$rc" = 0 ] || { echo "FAIL: run.sh help exited $rc"; printf '%s\n' "$out"; exit 1; }
          for f in .test-install/routes/r*-*.sh; do
            [ -e "$f" ] || continue
            id="$(basename "$f")"; id="${id%%-*}"
            grep -qE "^ *$id\)" .test-install/run.sh \
              || { echo "FAIL: $id has a route file but no route_file entry in run.sh"; rc=1; }
            grep -qF "$id" <<< "$out" \
              || { echo "FAIL: $id is not documented in the run.sh help text"; rc=1; }
          done
          [ "$rc" = 0 ] || exit 1
          echo "OK: run.sh help works and every route file is registered + documented"

      # Docs are the one change class that used to trigger 16 minutes of npm and
      # get nothing checked in return. Relative links and heading anchors are
      # checkable in milliseconds; external URLs are deliberately not fetched.
      - name: Docs links & anchors
        run: python3 .github/scripts/check-doc-links.py
